<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جزارة حمزة</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="top-bar">

        <a href="index.html" class="back-btn">
            →
        </a>

        <a href="index.html" class="home-logo">
            <img src="logo.png" class="top-logo" alt="SONIC">
        </a>

    </div>

    <img src="images/butcher1.jpg" class="shop-image" alt="جزارة حمزة">

    <h2 class="shop-title">جزارة حمزة</h2>

    <p id="shopStatus" style="
    font-size:20px;
    font-weight:bold;
    margin-top:10px;
    text-align:center;
    ">
    </p>

    <div class="info-box">
        <p>📍 العنوان:  أمام سوبر ماركت أحمد فؤاد</p>
        <p>🕒 مفتوح من 9 صباحاً حتى 12 مساءً</p>
    </div>

    <div class="about-shop">

        <h3>نبذة عن المحل</h3>

        <p>
            جزارة حمزة تقدم مجموعة متنوعة من اللحوم الطازجة يومياً،
            مع الاهتمام بالجودة والنظافة وتقديم أفضل خدمة للعملاء.
        </p>

    </div>

    <div class="stats">

        <div class="stat-card">
            <h3>⭐ 4.8</h3>
            <p>تقييم المحل</p>
        </div>

        <div class="stat-card">
            <h3>100+</h3>
            <p>عميل سعيد</p>
        </div>

        <div class="stat-card">
            <h3>1K+</h3>
            <p>زيارة</p>
        </div>

    </div>

    <a href="order.html?shop=جزارة حمزه&city=ميت الديبة" class="order-btn">
    🛒 اطلب الآن
</a>

    <a href="tel:01055924131" class="call-btn">
        📞 اتصل بنا
    </a>

    <script>

    function updateShopStatus(){

        const now = new Date();
        const hour = now.getHours();

        const status = document.getElementById("shopStatus");

        if(hour >= 9 && hour < 24){

            status.innerHTML = "🟢 مفتوح الآن";
            status.style.color = "#00ff66";

        }else{

            status.innerHTML = "🔴 مغلق الآن";
            status.style.color = "#ff4d4d";

        }

    }

    updateShopStatus();

    </script>

</body>

</html>
