<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أولاد حماده</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="top-bar">

        <a href="index.html" class="back-btn">
            →
        </a>

        <a href="index.html" class="home-logo">
            <img src="logo.png" class="top-logo" alt="SONIC">
        </a>

    </div>

    <img src="images/home1.jpg" class="shop-image" alt="أولاد حماده">

    <h2 class="shop-title">أولاد حماده</h2>

    <p id="shopStatus"
        style="
        font-size:20px;
        font-weight:bold;
        text-align:center;
        margin:15px 0;
        ">
    </p>

    <div class="info-box">
        <p>📍 العنوان: اكتب العنوان هنا</p>
        <p>🕒 مفتوح من 9 صباحاً حتى 12 مساءً</p>
    </div>

    <div class="about-shop">

        <h3>نبذة عن المحل</h3>

        <p>
            أولاد حماده يوفر تشكيلة متنوعة من الأدوات المنزلية
            وأدوات المطبخ والاحتياجات اليومية بجودة ممتازة
            وأسعار مناسبة لجميع العملاء.
        </p>

    </div>

    <div class="stats">

        <div class="stat-card">
            <h3>⭐ 4.7</h3>
            <p>تقييم المحل</p>
        </div>

        <div class="stat-card">
            <h3>250+</h3>
            <p>عميل سعيد</p>
        </div>

        <div class="stat-card">
            <h3>3K+</h3>
            <p>زيارة</p>
        </div>

    </div>

    <a href="order.html?shop=أولاد حماده&city=ميت الديبة" class="order-btn">
🛒 اطلب الآن
</a>

    <a href="tel:01055924131" class="call-btn">
        📞 اتصل بنا
    </a>

    <script>

        const now = new Date();
        const hour = now.getHours();

        const status = document.getElementById("shopStatus");

        if(hour >= 9 && hour < 24){

            status.innerHTML = "🟢 مفتوح الآن";
            status.style.color = "#00cc66";

        }else{

            status.innerHTML = "🔴 مغلق الآن";
            status.style.color = "#ff4444";

        }

    </script>

</body>

</html>
